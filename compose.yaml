services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - 127.0.0.1:${DB_PORT:-5432}:5432
    volumes:
      - codeconnect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  postgres-test:
    image: postgres:17.10-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: ${TEST_DB_NAME}
      POSTGRES_USER: ${TEST_DB_USER}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?TEST_DB_PASSWORD must be set}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - 127.0.0.1:${TEST_DB_PORT:-5433}:5432
    volumes:
      - codeconnect_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: 'no'

volumes:
  codeconnect_postgres_data:
  codeconnect_postgres_test_data:
